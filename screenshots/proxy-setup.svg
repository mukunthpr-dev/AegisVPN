<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50" y="60" font-family="Arial" font-size="20" fill="#222">System Proxy (macOS) — Example</text>
  <rect x="50" y="90" width="900" height="250" rx="6" fill="#f6f7fb" stroke="#e1e7f5"/>
  <text x="80" y="130" font-family="Courier New, monospace" font-size="14" fill="#333">scutil --proxy</text>
  <text x="80" y="160" font-family="Courier New, monospace" font-size="13" fill="#444">HTTPEnable : 1</text>
  <text x="80" y="185" font-family="Courier New, monospace" font-size="13" fill="#444">HTTPProxy  : 127.0.0.1</text>
  <text x="80" y="210" font-family="Courier New, monospace" font-size="13" fill="#444">HTTPPort   : 9090</text>
  <text x="80" y="235" font-family="Courier New, monospace" font-size="13" fill="#444">HTTPSEnable: 1</text>
  <text x="80" y="260" font-family="Courier New, monospace" font-size="13" fill="#444">HTTPSProxy : 127.0.0.1</text>
  <text x="80" y="285" font-family="Courier New, monospace" font-size="13" fill="#444">HTTPSPort  : 9090</text>
</svg>